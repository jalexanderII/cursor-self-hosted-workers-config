# This example assumes External Secrets Operator and a namespaced SecretStore
# named aws-secrets-manager already exist. The repository intentionally does not
# install or administer those enterprise platform components.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cursor-workers-api-key
  namespace: cursord
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: cursor-workers-api-key
    creationPolicy: Owner
    template:
      metadata:
        labels:
          workers.cursor.com/worker-deployment: cursor-workers
  data:
    - secretKey: api-key
      remoteRef:
        key: cursor/self-hosted-workers/cursor-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cursor-workers-scm
  namespace: cursord
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: cursor-workers-scm
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: cursor/self-hosted-workers/scm-token
